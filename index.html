<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Story Creator</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        * {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect } = React;

        const SocialStoryCreator = () => {
          const [characters, setCharacters] = useState([]);
          const [scenes, setScenes] = useState([]);
          const [apiKey, setApiKey] = useState('');
          const [showApiKeyInput, setShowApiKeyInput] = useState(false);
          const [storySettings, setStorySettings] = useState({
            title: '',
            mainSetting: '',
            frameStyle: 'Rounded border, A4 ratio (vertical), white margin with top title bar'
          });
          const [currentScene, setCurrentScene] = useState({
            number: 1,
            titleText: '',
            charactersPresent: [],
            mainAction: '',
            sceneBackground: '',
            lightingMood: 'Bright and sunny, playful midday light',
            artStyle: 'Flat color cartoon illustration, clean black outlines, child-friendly aesthetic',
            cameraAngle: 'Eye-level view, medium shot',
            characterExpressions: {},
            onImageText: ''
          });
          const [newCharacter, setNewCharacter] = useState({
            name: '',
            age: '',
            gender: '',
            skinTone: '',
            hair: '',
            eyes: '',
            eyebrows: '',
            mouth: '',
            facialFeatures: '',
            clothing: '',
            bodyBuild: '',
            style: 'Flat color cartoon illustration, clean outlines, child-friendly proportions'
          });
          const [generatedImage, setGeneratedImage] = useState(null);
          const [isGenerating, setIsGenerating] = useState(false);
          const [showCharacterForm, setShowCharacterForm] = useState(false);
          const [activeTab, setActiveTab] = useState('characters');

          // Load API key from localStorage on component mount
          useEffect(() => {
            const savedApiKey = localStorage.getItem('openai_api_key');
            if (savedApiKey) {
              setApiKey(savedApiKey);
            } else {
              setShowApiKeyInput(true);
            }
          }, []);

          const saveApiKey = () => {
            if (apiKey.trim()) {
              localStorage.setItem('openai_api_key', apiKey.trim());
              setShowApiKeyInput(false);
            }
          };

          const clearApiKey = () => {
            localStorage.removeItem('openai_api_key');
            setApiKey('');
            setShowApiKeyInput(true);
          };

          const generateCharacterDescription = async (character) => {
            if (!apiKey) {
              alert('Please enter your OpenAI API key first.');
              setShowApiKeyInput(true);
              return character;
            }

            try {
              const response = await fetch("https://api.openai.com/v1/chat/completions", {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "Authorization": `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                  model: "gpt-4",
                  max_tokens: 1000,
                  messages: [
                    {
                      role: "user",
                      content: `Generate detailed character description for a children's social story illustration. 
                      Character details provided: Name: ${character.name}, Age: ${character.age}, Gender: ${character.gender}
                      
                      Fill in missing details for: skin tone, hair (style, color, length), eyes (shape, color), eyebrows, mouth, facial features, clothing (top, bottom, shoes), body build.
                      
                      Use child-friendly cartoon proportions. Format as separate fields exactly like this example:
                      Skin tone: Light peach/pale
                      Hair: Straight, golden blonde, medium-length, side-parted, with slight wave at the ends
                      Eyes: Large, round, black pupils with expressive cartoon shine
                      Eyebrows: Thin, light brown, arched gently
                      Mouth: Simple curved smile or expressive relevant to emotions
                      Facial Features: Rounded cheeks, small nose, cartoon proportions with a large head relative to body
                      Clothing: Top: [item], Bottom: [item], Shoes: [item]
                      Body Build: Small and childlike, with proportionally large head and short limbs for a toddler-like appearance`
                    }
                  ]
                })
              });

              if (!response.ok) {
                throw new Error(`API Error: ${response.status}`);
              }

              const data = await response.json();
              const description = data.choices[0].message.content;
              
              // Parse the description to fill in the character fields
              const lines = description.split('\n');
              const updatedCharacter = { ...character };
              
              lines.forEach(line => {
                if (line.includes('Skin tone:')) updatedCharacter.skinTone = line.split('Skin tone:')[1].trim();
                if (line.includes('Hair:')) updatedCharacter.hair = line.split('Hair:')[1].trim();
                if (line.includes('Eyes:')) updatedCharacter.eyes = line.split('Eyes:')[1].trim();
                if (line.includes('Eyebrows:')) updatedCharacter.eyebrows = line.split('Eyebrows:')[1].trim();
                if (line.includes('Mouth:')) updatedCharacter.mouth = line.split('Mouth:')[1].trim();
                if (line.includes('Facial Features:')) updatedCharacter.facialFeatures = line.split('Facial Features:')[1].trim();
                if (line.includes('Clothing:')) updatedCharacter.clothing = line.split('Clothing:')[1].trim();
                if (line.includes('Body Build:')) updatedCharacter.bodyBuild = line.split('Body Build:')[1].trim();
              });
              
              return updatedCharacter;
            } catch (error) {
              console.error('Error generating character description:', error);
              alert(`Error generating character description: ${error.message}`);
              return character;
            }
          };

          const addCharacter = async () => {
            let finalCharacter = { ...newCharacter };
            
            // If any fields are empty, generate description
            const requiredFields = ['skinTone', 'hair', 'eyes', 'clothing'];
            const hasEmptyFields = requiredFields.some(field => !finalCharacter[field]);
            
            if (hasEmptyFields) {
              finalCharacter = await generateCharacterDescription(finalCharacter);
            }
            
            setCharacters([...characters, finalCharacter]);
            setNewCharacter({
              name: '', age: '', gender: '', skinTone: '', hair: '', eyes: '',
              eyebrows: '', mouth: '', facialFeatures: '', clothing: '', bodyBuild: '',
              style: 'Flat color cartoon illustration, clean outlines, child-friendly proportions'
            });
            setShowCharacterForm(false);
          };

          const generateScenePrompt = () => {
            const selectedCharacters = characters.filter(char => 
              currentScene.charactersPresent.includes(char.name)
            );

            return `Create an image with the following:

*****************************************************************************************************
*****************************************************************************************************

Base parameters: 

*****************************************************************************************************
*****************************************************************************************************

frame_style: ${storySettings.frameStyle}
Scene Number: ${currentScene.number}
title_text: ${currentScene.titleText}

*******************************************************************************************************
*******************************************************************************************************

characters_present: 

*******************************************************************************************************
*******************************************************************************************************

${selectedCharacters.map(char => `
Character Name: ${char.name}
Age: ${char.age} years old
Gender: ${char.gender}
Skin tone: ${char.skinTone}
Hair: ${char.hair}
Eyes: ${char.eyes}
Eyebrows: ${char.eyebrows}
Mouth: ${char.mouth}
Facial Features: ${char.facialFeatures}
Clothing: ${char.clothing}
Body Build: ${char.bodyBuild}
Style: ${char.style}
`).join('\n*******************************************************************************************************\n')}

*******************************************************************************************************
*******************************************************************************************************
 
main_action: ${currentScene.mainAction}

*******************************************************************************************************
*******************************************************************************************************
  
scene_background: ${currentScene.sceneBackground}
lighting_mood: ${currentScene.lightingMood}
art_style: ${currentScene.artStyle}
camera_angle: ${currentScene.cameraAngle}

*******************************************************************************************************
*******************************************************************************************************

character_expression_pose: ${Object.entries(currentScene.characterExpressions).map(([name, expr]) => `${name} is ${expr}`).join(', ')}

*******************************************************************************************************
*******************************************************************************************************

on_image_text: ${currentScene.onImageText}`;
          };

          const generateImage = async () => {
            if (!apiKey) {
              alert('Please enter your OpenAI API key first.');
              setShowApiKeyInput(true);
              return;
            }

            setIsGenerating(true);
            try {
              const prompt = generateScenePrompt();
              
              // Simplified prompt for better DALL-E results
              const dallePrompt = `Children's cartoon illustration: ${currentScene.titleText}. ${currentScene.mainAction}. Background: ${currentScene.sceneBackground}. Art style: flat color cartoon illustration with clean outlines, child-friendly aesthetic. Characters: ${currentScene.charactersPresent.map(name => {
                const char = characters.find(c => c.name === name);
                if (char) {
                  return `${char.name} (${char.age} year old ${char.gender}) with ${char.hair}, ${char.eyes}, wearing ${char.clothing}`;
                }
                return name;
              }).join(', ')}`;

              console.log('Generating image with prompt:', dallePrompt);
              
              // Use DALL-E for image generation
              const response = await fetch("https://api.openai.com/v1/images/generations", {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "Authorization": `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                  model: "dall-e-3",
                  prompt: dallePrompt,
                  size: "1024x1024",
                  quality: "standard",
                  n: 1,
                })
              });

              if (!response.ok) {
                const errorText = await response.text();
                console.error('API Response Error:', errorText);
                throw new Error(`API Error: ${response.status} - ${errorText}`);
              }

              const data = await response.json();
              console.log('DALL-E Response:', data);
              
              if (data.data && data.data[0] && data.data[0].url) {
                const imageUrl = data.data[0].url;
                console.log('Image URL received:', imageUrl);
                
                // Convert image to base64 to avoid CORS issues
                try {
                  const imageResponse = await fetch(imageUrl);
                  const imageBlob = await imageResponse.blob();
                  const base64 = await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result);
                    reader.readAsDataURL(imageBlob);
                  });
                  
                  setGeneratedImage({
                    url: base64,
                    originalUrl: imageUrl,
                    prompt: prompt,
                    dallePrompt: dallePrompt
                  });
                  console.log('Image successfully converted to base64');
                } catch (corsError) {
                  console.log('CORS conversion failed, using direct URL:', corsError);
                  // Fallback to direct URL if conversion fails
                  setGeneratedImage({
                    url: imageUrl,
                    originalUrl: imageUrl,
                    prompt: prompt,
                    dallePrompt: dallePrompt
                  });
                }
              } else {
                throw new Error('No image URL in response');
              }
            } catch (error) {
              console.error('Error generating image:', error);
              alert(`Error generating image: ${error.message}\n\nCheck the browser console for more details.`);
            }
            setIsGenerating(false);
          };

          const addSceneToStory = () => {
            setScenes([...scenes, { ...currentScene, image: generatedImage }]);
            setCurrentScene({
              ...currentScene,
              number: currentScene.number + 1,
              titleText: '',
              mainAction: '',
              characterExpressions: {},
              onImageText: ''
            });
            setGeneratedImage(null);
          };

          return (
            <div className="min-h-screen bg-gradient-to-br from-orange-50 via-blue-50 to-green-50 p-4">
              <div className="max-w-7xl mx-auto">
                <header className="text-center mb-8 p-6 bg-white/80 backdrop-blur-sm rounded-3xl shadow-lg border border-orange-200">
                  <h1 className="text-4xl font-bold bg-gradient-to-r from-orange-600 to-blue-600 bg-clip-text text-transparent mb-2">
                    Social Story Creator
                  </h1>
                  <p className="text-gray-600 text-lg mb-4">Create engaging visual stories for children</p>
                  
                  {/* API Key Management */}
                  <div className="max-w-2xl mx-auto">
                    {showApiKeyInput ? (
                      <div className="bg-yellow-50 border border-yellow-200 rounded-xl p-4">
                        <h3 className="font-semibold text-yellow-800 mb-2">OpenAI API Key Required</h3>
                        <p className="text-yellow-700 text-sm mb-3">
                          Enter your OpenAI API key to use character generation and image creation features.
                          Your key is stored locally in your browser and never sent to our servers.
                        </p>
                        <div className="flex gap-2">
                          <input
                            type="password"
                            className="flex-1 p-2 rounded-lg border border-yellow-300 focus:outline-none focus:border-yellow-500"
                            placeholder="sk-..."
                            value={apiKey}
                            onChange={(e) => setApiKey(e.target.value)}
                          />
                          <button
                            onClick={saveApiKey}
                            className="bg-yellow-500 hover:bg-yellow-600 text-white px-4 py-2 rounded-lg font-semibold transition-colors"
                          >
                            Save
                          </button>
                        </div>
                        <p className="text-xs text-yellow-600 mt-2">
                          Get your API key at <a href="https://platform.openai.com/api-keys" target="_blank" rel="noopener noreferrer" className="underline">platform.openai.com/api-keys</a>
                        </p>
                      </div>
                    ) : (
                      <div className="bg-green-50 border border-green-200 rounded-xl p-3">
                        <div className="flex items-center justify-between">
                          <div className="flex items-center space-x-2">
                            <span className="text-green-600 font-semibold">✓ API Key Connected</span>
                            <span className="text-green-600 text-sm">({apiKey.slice(0, 7)}...)</span>
                          </div>
                          <button
                            onClick={clearApiKey}
                            className="text-green-600 hover:text-green-800 text-sm underline"
                          >
                            Change Key
                          </button>
                        </div>
                      </div>
                    )}
                  </div>
                </header>

                {/* Story Settings */}
                <div className="mb-6 p-6 bg-white/80 backdrop-blur-sm rounded-2xl shadow-lg border border-blue-200">
                  <h2 className="text-2xl font-bold text-gray-800 mb-4">Story Settings</h2>
                  <div className="grid md:grid-cols-3 gap-4">
                    <input
                      className="p-3 rounded-xl border-2 border-gray-200 focus:border-orange-400 focus:outline-none transition-colors"
                      placeholder="Story Title"
                      value={storySettings.title}
                      onChange={(e) => setStorySettings({...storySettings, title: e.target.value})}
                    />
                    <input
                      className="p-3 rounded-xl border-2 border-gray-200 focus:border-orange-400 focus:outline-none transition-colors"
                      placeholder="Main Setting (e.g., school playground, home kitchen)"
                      value={storySettings.mainSetting}
                      onChange={(e) => setStorySettings({...storySettings, mainSetting: e.target.value})}
                    />
                    <select
                      className="p-3 rounded-xl border-2 border-gray-200 focus:border-orange-400 focus:outline-none transition-colors"
                      value={storySettings.frameStyle}
                      onChange={(e) => setStorySettings({...storySettings, frameStyle: e.target.value})}
                    >
                      <option>Rounded border, A4 ratio (vertical), white margin with top title bar</option>
                      <option>Square format, minimal border</option>
                      <option>Comic book style panels</option>
                      <option>Polaroid photo style frame</option>
                    </select>
                  </div>
                </div>

                {/* Tab Navigation */}
                <div className="mb-6 flex space-x-2">
                  {['characters', 'scenes', 'story'].map((tab) => (
                    <button
                      key={tab}
                      onClick={() => setActiveTab(tab)}
                      className={`px-6 py-3 rounded-xl font-semibold transition-all ${
                        activeTab === tab
                          ? 'bg-orange-500 text-white shadow-lg transform scale-105'
                          : 'bg-white/80 text-gray-700 hover:bg-orange-100'
                      }`}
                    >
                      {tab.charAt(0).toUpperCase() + tab.slice(1)}
                    </button>
                  ))}
                </div>

                {/* Characters Tab */}
                {activeTab === 'characters' && (
                  <div className="space-y-6">
                    <div className="bg-white/80 backdrop-blur-sm rounded-2xl shadow-lg border border-green-200 p-6">
                      <div className="flex justify-between items-center mb-4">
                        <h2 className="text-2xl font-bold text-gray-800">Characters</h2>
                        <button
                          onClick={() => setShowCharacterForm(!showCharacterForm)}
                          className="bg-green-500 hover:bg-green-600 text-white px-6 py-2 rounded-xl font-semibold transition-colors"
                        >
                          Add New Character
                        </button>
                      </div>

                      {showCharacterForm && (
                        <div className="mb-6 p-6 bg-green-50 rounded-xl border-2 border-green-200">
                          <h3 className="text-xl font-semibold mb-4">New Character</h3>
                          <div className="grid md:grid-cols-3 gap-4 mb-4">
                            <input
                              className="p-3 rounded-xl border-2 border-gray-200 focus:border-green-400 focus:outline-none transition-colors"
                              placeholder="Name *"
                              value={newCharacter.name}
                              onChange={(e) => setNewCharacter({...newCharacter, name: e.target.value})}
                              required
                            />
                            <input
                              className="p-3 rounded-xl border-2 border-gray-200 focus:border-green-400 focus:outline-none transition-colors"
                              placeholder="Age *"
                              type="number"
                              value={newCharacter.age}
                              onChange={(e) => setNewCharacter({...newCharacter, age: e.target.value})}
                              required
                            />
                            <select
                              className="p-3 rounded-xl border-2 border-gray-200 focus:border-green-400 focus:outline-none transition-colors"
                              value={newCharacter.gender}
                              onChange={(e) => setNewCharacter({...newCharacter, gender: e.target.value})}
                              required
                            >
                              <option value="">Select Gender *</option>
                              <option value="Female">Female</option>
                              <option value="Male">Male</option>
                              <option value="Non-binary">Non-binary</option>
                            </select>
                          </div>
                          
                          <div className="grid md:grid-cols-2 gap-4 mb-4">
                            <input
                              className="p-3 rounded-xl border-2 border-gray-200 focus:border-green-400 focus:outline-none transition-colors"
                              placeholder="Skin tone (leave blank for AI generation)"
                              value={newCharacter.skinTone}
                              onChange={(e) => setNewCharacter({...newCharacter, skinTone: e.target.value})}
                            />
                            <input
                              className="p-3 rounded-xl border-2 border-gray-200 focus:border-green-400 focus:outline-none transition-colors"
                              placeholder="Hair description (leave blank for AI generation)"
                              value={newCharacter.hair}
                              onChange={(e) => setNewCharacter({...newCharacter, hair: e.target.value})}
                            />
                            <input
                              className="p-3 rounded-xl border-2 border-gray-200 focus:border-green-400 focus:outline-none transition-colors"
                              placeholder="Eyes description (leave blank for AI generation)"
                              value={newCharacter.eyes}
                              onChange={(e) => setNewCharacter({...newCharacter, eyes: e.target.value})}
                            />
                            <input
                              className="p-3 rounded-xl border-2 border-gray-200 focus:border-green-400 focus:outline-none transition-colors"
                              placeholder="Clothing description (leave blank for AI generation)"
                              value={newCharacter.clothing}
                              onChange={(e) => setNewCharacter({...newCharacter, clothing: e.target.value})}
                            />
                          </div>
                          
                          <div className="flex space-x-4">
                            <button
                              onClick={addCharacter}
                              className="bg-green-500 hover:bg-green-600 text-white px-6 py-2 rounded-xl font-semibold transition-colors"
                              disabled={!newCharacter.name || !newCharacter.age || !newCharacter.gender}
                            >
                              Add Character
                            </button>
                            <button
                              onClick={() => setShowCharacterForm(false)}
                              className="bg-gray-300 hover:bg-gray-400 text-gray-700 px-6 py-2 rounded-xl font-semibold transition-colors"
                            >
                              Cancel
                            </button>
                          </div>
                        </div>
                      )}

                      <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-4">
                        {characters.map((character, index) => (
                          <div key={index} className="bg-white p-4 rounded-xl shadow border border-gray-200">
                            <h4 className="font-bold text-lg text-gray-800">{character.name}</h4>
                            <p className="text-gray-600">Age: {character.age}, Gender: {character.gender}</p>
                            <p className="text-sm text-gray-500 mt-2">Skin: {character.skinTone}</p>
                            <p className="text-sm text-gray-500">Hair: {character.hair}</p>
                            <p className="text-sm text-gray-500">Eyes: {character.eyes}</p>
                            <p className="text-sm text-gray-500">Clothing: {character.clothing}</p>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                )}

                {/* Scenes Tab */}
                {activeTab === 'scenes' && (
                  <div className="space-y-6">
                    <div className="bg-white/80 backdrop-blur-sm rounded-2xl shadow-lg border border-blue-200 p-6">
                      <h2 className="text-2xl font-bold text-gray-800 mb-4">Scene Builder</h2>
                      
                      <div className="grid md:grid-cols-2 gap-6">
                        <div className="space-y-4">
                          <div>
                            <label className="block text-sm font-semibold text-gray-700 mb-2">Scene Title</label>
                            <input
                              className="w-full p-3 rounded-xl border-2 border-gray-200 focus:border-blue-400 focus:outline-none transition-colors"
                              placeholder="Describe what's happening in this scene"
                              value={currentScene.titleText}
                              onChange={(e) => setCurrentScene({...currentScene, titleText: e.target.value})}
                            />
                          </div>

                          <div>
                            <label className="block text-sm font-semibold text-gray-700 mb-2">Characters Present</label>
                            <div className="space-y-2">
                              {characters.map((character) => (
                                <label key={character.name} className="flex items-center space-x-2">
                                  <input
                                    type="checkbox"
                                    checked={currentScene.charactersPresent.includes(character.name)}
                                    onChange={(e) => {
                                      if (e.target.checked) {
                                        setCurrentScene({
                                          ...currentScene,
                                          charactersPresent: [...currentScene.charactersPresent, character.name]
                                        });
                                      } else {
                                        setCurrentScene({
                                          ...currentScene,
                                          charactersPresent: currentScene.charactersPresent.filter(name => name !== character.name)
                                        });
                                      }
                                    }}
                                    className="w-4 h-4 text-blue-600 rounded"
                                  />
                                  <span className="text-gray-700">{character.name}</span>
                                </label>
                              ))}
                            </div>
                          </div>

                          <div>
                            <label className="block text-sm font-semibold text-gray-700 mb-2">Main Action</label>
                            <textarea
                              className="w-full p-3 rounded-xl border-2 border-gray-200 focus:border-blue-400 focus:outline-none transition-colors"
                              placeholder="Describe what's happening in the scene"
                              rows={3}
                              value={currentScene.mainAction}
                              onChange={(e) => setCurrentScene({...currentScene, mainAction: e.target.value})}
                            />
                          </div>

                          <div>
                            <label className="block text-sm font-semibold text-gray-700 mb-2">Scene Background</label>
                            <input
                              className="w-full p-3 rounded-xl border-2 border-gray-200 focus:border-blue-400 focus:outline-none transition-colors"
                              placeholder="Describe the setting/background"
                              value={currentScene.sceneBackground}
                              onChange={(e) => setCurrentScene({...currentScene, sceneBackground: e.target.value})}
                            />
                          </div>
                        </div>

                        <div className="space-y-4">
                          <div>
                            <label className="block text-sm font-semibold text-gray-700 mb-2">Character Expressions</label>
                            {currentScene.charactersPresent.map((characterName) => (
                              <div key={characterName} className="mb-2">
                                <input
                                  className="w-full p-2 rounded-lg border border-gray-200 focus:border-blue-400 focus:outline-none transition-colors text-sm"
                                  placeholder={`${characterName}'s expression/pose`}
                                  value={currentScene.characterExpressions[characterName] || ''}
                                  onChange={(e) => setCurrentScene({
                                    ...currentScene,
                                    characterExpressions: {
                                      ...currentScene.characterExpressions,
                                      [characterName]: e.target.value
                                    }
                                  })}
                                />
                              </div>
                            ))}
                          </div>

                          <div>
                            <label className="block text-sm font-semibold text-gray-700 mb-2">Camera Angle</label>
                            <select
                              className="w-full p-3 rounded-xl border-2 border-gray-200 focus:border-blue-400 focus:outline-none transition-colors"
                              value={currentScene.cameraAngle}
                              onChange={(e) => setCurrentScene({...currentScene, cameraAngle: e.target.value})}
                            >
                              <option>Eye-level view, medium shot</option>
                              <option>Close-up on characters</option>
                              <option>Wide shot showing full scene</option>
                              <option>High angle looking down</option>
                              <option>Low angle looking up</option>
                            </select>
                          </div>

                          <div>
                            <label className="block text-sm font-semibold text-gray-700 mb-2">On-Image Text</label>
                            <textarea
                              className="w-full p-3 rounded-xl border-2 border-gray-200 focus:border-blue-400 focus:outline-none transition-colors"
                              placeholder="Text bubbles, thought bubbles, or captions"
                              rows={3}
                              value={currentScene.onImageText}
                              onChange={(e) => setCurrentScene({...currentScene, onImageText: e.target.value})}
                            />
                          </div>
                        </div>
                      </div>

                      <div className="mt-6 flex justify-center">
                        <button
                          onClick={generateImage}
                          disabled={isGenerating || !currentScene.titleText || !currentScene.mainAction}
                          className="bg-blue-500 hover:bg-blue-600 disabled:bg-gray-300 text-white px-8 py-3 rounded-xl font-semibold transition-all disabled:cursor-not-allowed"
                        >
                          {isGenerating ? 'Generating Scene...' : 'Generate Scene Image'}
                        </button>
                      </div>

                      {generatedImage && (
                        <div className="mt-6 p-6 bg-gray-50 rounded-xl">
                          <h3 className="text-xl font-semibold mb-4">Generated Scene</h3>
                          <div className="flex flex-col lg:flex-row gap-6">
                            <div className="flex-1">
                              <div className="max-w-md mx-auto">
                                <img
                                  src={generatedImage.url}
                                  alt="Generated scene"
                                  className="w-full rounded-lg shadow-lg border"
                                  onLoad={() => console.log('Image loaded successfully')}
                                  onError={(e) => {
                                    console.error('Image failed to load:', e);
                                    console.log('Failed URL:', generatedImage.url);
                                    e.target.style.display = 'none';
                                    e.target.nextSibling.style.display = 'block';
                                  }}
                                />
                                <div style={{display: 'none'}} className="bg-red-50 border border-red-200 rounded-lg p-4 text-center">
                                  <p className="text-red-600 font-semibold">Image failed to load</p>
                                  <p className="text-xs text-red-500 mt-2">Check browser console for details</p>
                                  {generatedImage.originalUrl && (
                                    <a 
                                      href={generatedImage.originalUrl} 
                                      target="_blank" 
                                      rel="noopener noreferrer"
                                      className="text-blue-600 underline text-sm mt-2 block"
                                    >
                                      Try opening direct URL
                                    </a>
                                  )}
                                </div>
                              </div>
                            </div>
                            <div className="flex-1">
                              <div className="space-y-4">
                                <div>
                                  <h4 className="font-semibold mb-2">DALL-E Prompt Used:</h4>
                                  <pre className="text-xs bg-white p-3 rounded-lg overflow-auto max-h-32 border">
                                    {generatedImage.dallePrompt || 'No prompt available'}
                                  </pre>
                                </div>
                                
                                <div>
                                  <h4 className="font-semibold mb-2">Full Template:</h4>
                                  <pre className="text-xs bg-white p-3 rounded-lg overflow-auto max-h-32 border">
                                    {generatedImage.prompt}
                                  </pre>
                                </div>
                                
                                <div className="text-xs text-gray-500 bg-blue-50 p-3 rounded-lg">
                                  <p><strong>Debug Info:</strong></p>
                                  <p>Image URL type: {generatedImage.url ? (generatedImage.url.startsWith('data:') ? 'Base64' : 'Direct URL') : 'None'}</p>
                                  <p>URL length: {generatedImage.url ? generatedImage.url.length : 0} characters</p>
                                </div>
                              </div>
                              
                              <div className="mt-4 flex space-x-4">
                                <button
                                  onClick={addSceneToStory}
                                  className="bg-green-500 hover:bg-green-600 text-white px-6 py-2 rounded-xl font-semibold transition-colors"
                                >
                                  Add to Story
                                </button>
                                <button
                                  onClick={() => setGeneratedImage(null)}
                                  className="bg-red-500 hover:bg-red-600 text-white px-6 py-2 rounded-xl font-semibold transition-colors"
                                >
                                  Delete & Edit
                                </button>
                                {generatedImage.originalUrl && (
                                  <a
                                    href={generatedImage.originalUrl}
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    className="bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded-xl font-semibold transition-colors text-center"
                                  >
                                    Open Direct
                                  </a>
                                )}
                              </div>
                            </div>
                          </div>
                        </div>
                      )}
                    </div>
                  </div>
                )}

                {/* Story Tab */}
                {activeTab === 'story' && (
                  <div className="bg-white/80 backdrop-blur-sm rounded-2xl shadow-lg border border-purple-200 p-6">
                    <h2 className="text-2xl font-bold text-gray-800 mb-4">Your Story: "{storySettings.title || 'Untitled Story'}"</h2>
                    
                    {scenes.length === 0 ? (
                      <div className="text-center py-12">
                        <div className="text-gray-400 text-6xl mb-4">📚</div>
                        <p className="text-gray-600 text-lg">No scenes created yet. Go to the Scenes tab to start building your story!</p>
                      </div>
                    ) : (
                      <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                        {scenes.map((scene, index) => (
                          <div key={index} className="bg-white rounded-xl shadow-lg border border-gray-200 overflow-hidden">
                            <div className="bg-gradient-to-r from-purple-500 to-pink-500 text-white p-3">
                              <h3 className="font-bold">Scene {scene.number}</h3>
                            </div>
                            <div className="p-4">
                              <h4 className="font-semibold mb-2">{scene.titleText}</h4>
                              {scene.image && (
                                <img
                                  src={scene.image.url}
                                  alt={`Scene ${scene.number}`}
                                  className="w-full rounded-lg mb-3"
                                />
                              )}
                              <p className="text-sm text-gray-600 mb-2">{scene.mainAction}</p>
                              <div className="text-xs text-gray-500">
                                Characters: {scene.charactersPresent.join(', ')}
                              </div>
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                )}
              </div>
            </div>
          );
        };

        ReactDOM.render(<SocialStoryCreator />, document.getElementById('root'));
    </script>
</body>
</html>
